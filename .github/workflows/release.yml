name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    # Linux targets cross-compile from Ubuntu; Apple targets must build on macOS
    # (the SDK is not redistributable), so each entry names its own runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: linux,  arch: amd64, runner: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: linux,  arch: arm64, runner: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin,        os: darwin, arch: amd64, runner: macos-13,      cross: false }
          - { target: aarch64-apple-darwin,       os: darwin, arch: arm64, runner: macos-latest,  cross: false }
    steps:
      - uses: actions/checkout@v4
      - name: Build (cross, Linux)
        if: matrix.cross
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked"
      - name: Build (native, macOS)
        if: ${{ !matrix.cross }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          OUT=kumapulse-${{ matrix.os }}-${{ matrix.arch }}
          cp "target/${{ matrix.target }}/release/kumapulse" "$OUT"
          if command -v sha256sum >/dev/null; then sha256sum "$OUT"; else shasum -a 256 "$OUT"; fi | tee "$OUT.sha256"
          du -h "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: kumapulse-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            kumapulse-${{ matrix.os }}-${{ matrix.arch }}
            kumapulse-${{ matrix.os }}-${{ matrix.arch }}.sha256

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kumapulse
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  publish:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Static binaries for Linux (musl, amd64/arm64) and macOS (amd64/arm64),
            plus a multi-arch distroless image at
            `ghcr.io/${{ github.repository_owner }}/kumapulse`.

            Verify a download against the `.sha256` file beside it.
