name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: linux,  arch: amd64 }
          - { target: aarch64-unknown-linux-musl, os: linux,  arch: arm64 }
          - { target: x86_64-apple-darwin,        os: darwin, arch: amd64 }
          - { target: aarch64-apple-darwin,       os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Build static binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked"
      - name: Package
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/kumapulse
          OUT=kumapulse-${{ matrix.os }}-${{ matrix.arch }}
          cp "$BIN" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "size: $(du -h "$OUT" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: kumapulse-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            kumapulse-${{ matrix.os }}-${{ matrix.arch }}
            kumapulse-${{ matrix.os }}-${{ matrix.arch }}.sha256

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kumapulse
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  publish:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Static binaries for Linux (musl, amd64/arm64) and macOS (amd64/arm64),
            plus a multi-arch distroless container image at
            `ghcr.io/${{ github.repository_owner }}/kumapulse`.

            Verify a download with the `.sha256` file beside it.
