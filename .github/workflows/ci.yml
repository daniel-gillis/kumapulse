name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Licences, advisories, bans, sources
        run: cargo deny check

  msrv:
    # Pinned to the lowest toolchain that actually compiles the dependency tree
    # (rusqlite 0.41 bundles SQLite 3.54.1 to clear CVE-2026-119375 and declares 1.89).
    name: minimum supported rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo build --locked

  binary-size:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Report and enforce the binary budget
        run: |
          SIZE=$(stat -c%s target/release/kumapulse)
          echo "release binary: $((SIZE / 1024)) KiB"
          echo "### Release binary: $((SIZE / 1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt 12582912 ]; then
            echo "::error::binary grew past the 12 MiB budget — check new dependencies"
            exit 1
          fi
