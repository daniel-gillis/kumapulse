# Run kumapulse in Kubernetes next to Uptime Kuma.
#
# Assumes Kuma's PVC is mounted read-only at /kuma. If Kuma runs outside the
# cluster, drop the hostPath volume and set KUMA_URL + KUMA_SOURCE=api instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kumapulse
  labels: { app.kubernetes.io/name: kumapulse }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kumapulse }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kumapulse }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kumapulse
          image: ghcr.io/daniel-gillis/kumapulse:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: KUMA_SOURCE
              value: sqlite
            - name: KUMA_DB
              value: /kuma/kuma.db
          ports:
            - { name: metrics, containerPort: 9797 }
          volumeMounts:
            - { name: kuma-data, mountPath: /kuma, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: kumapulse
  labels: { app.kubernetes.io/name: kumapulse }
spec:
  selector: { app.kubernetes.io/name: kumapulse }
  ports:
    - { name: metrics, port: 9797, targetPort: metrics }
---
# Requires the Prometheus Operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kumapulse
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: kumapulse }
  endpoints:
    - { port: metrics, interval: 30s }
