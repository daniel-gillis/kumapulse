<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="kumapulse">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0b1220"/>
  <rect x="6" y="6" width="116" height="116" rx="23" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.55"/>
  <!-- heartbeat trace: the Kuma check that becomes a metric -->
  <path d="M18 74 H38 l8-22 10 40 10-30 8 12 h16"
        fill="none" stroke="url(#g)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pulse dot at the end of the trace -->
  <circle cx="104" cy="74" r="6.5" fill="#5eead4"/>
</svg>
